<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>321Fit — Google Play feature graphic</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }

  /* 1024×500 is Play's fixed feature-graphic size — not configurable on their side. */
  .fg {
    position: relative; overflow: hidden;
    /* Same brand ramp as the screenshot frames (render.js), but re-weighted for a
       wide short canvas: on 1024×500 the 158deg axis resolves almost entirely into
       the teal end, which reads green next to the navy-dominant screenshots. Navy
       holds ~3/4 of the field here so the whole listing reads as one family. */
    background: linear-gradient(104deg, #0e3454 0%, #103a5c 44%, #0c4a58 80%, #0c574c 100%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #fff;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  /* Accent glow behind the wordmark — same device as .sa-glow in render.js,
     scaled down for the shorter canvas. */
  .fg-glow {
    position: absolute; right: -220px; bottom: -300px;
    width: 860px; height: 860px; border-radius: 50%;
    filter: blur(150px); opacity: 0.24; pointer-events: none;
  }
  /* Cooler counter-glow top-left so the field isn't a flat wash. */
  .fg-glow-2 {
    position: absolute; left: -200px; top: -300px;
    width: 780px; height: 780px; border-radius: 50%;
    background: radial-gradient(circle, #03b2e2 0%, rgba(0,0,0,0) 62%);
    filter: blur(150px); opacity: 0.22; pointer-events: none;
  }
  /* Vignette keeps the edges dark so the graphic holds together when Play
     crops or overlays it. */
  .fg-vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 42%, rgba(0,0,0,0.34) 100%);
  }

  .fg-content {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    /* Safe area — Play crops the outer edges on some surfaces. */
    padding: 0 120px; text-align: center;
  }

  .fg-logo { display: block; width: 400px; height: auto; }
  .fg-logo path { shape-rendering: geometricPrecision; }

  /* Hairline gradient rule — ties the wordmark to the tagline without adding
     another text element. */
  .fg-rule {
    width: 200px; height: 3px; margin: 40px 0 34px; border-radius: 3px;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, #05e0a6 50%, rgba(255,255,255,0) 100%);
    opacity: 0.85;
  }

  .fg-tagline {
    margin: 0;
    font-size: 46px; font-weight: 600; line-height: 1.15;
    letter-spacing: -0.015em;
    color: rgba(255, 255, 255, 0.94);
  }
</style>

<script type="module">
  import { FEATURE, ACCENTS } from "./config.js";

  const accent = ACCENTS[FEATURE.accent] || ACCENTS.teal;
  const fg = document.getElementById("fg");
  fg.style.width = FEATURE.W + "px";
  fg.style.height = FEATURE.H + "px";
  document.getElementById("glow").style.background =
    `radial-gradient(circle, ${accent} 0%, rgba(0,0,0,0) 60%)`;
  document.getElementById("tagline").textContent = FEATURE.tagline;

  window.__fgReady = true;
</script>
