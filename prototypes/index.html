<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>321Fit — Design workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0a;
    --surface: #1E2126;
    --surface-high: #282D34;
    --text: #FFFFFF;
    --text-secondary: #8B9099;
    --text-tertiary: #5C6370;
    --brand-primary: #00A7D0;
    --brand-secondary: #00E29D;
    --brand-gradient: linear-gradient(135deg, #00A7D0, #00E29D);
    --divider: #2E333A;
  }
  body {
    font-family: 'Rubik', -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 72px 24px 48px;
    display: flex; flex-direction: column; align-items: center;
  }

  .head { text-align: center; margin-bottom: 44px; max-width: 620px; }
  .logo {
    font-size: 38px; font-weight: 700; margin-bottom: 10px;
    background: var(--brand-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub { font-size: 17px; color: var(--text-secondary); line-height: 1.5; }
  .stamp { margin-top: 12px; font-size: 12px; color: var(--text-tertiary); }

  /* One card per destination. Adding another is one entry in ENTRIES. */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
    gap: 20px; width: 100%; max-width: 1080px;
  }
  .card {
    position: relative; display: flex; flex-direction: column;
    padding: 30px 28px 26px; border-radius: 22px;
    background: var(--surface); border: 1px solid var(--divider);
    text-decoration: none; color: inherit; overflow: hidden;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .card::after {                       /* the accent lives on the edge, not the fill */
    content: ''; position: absolute; inset: 0 0 auto 0; height: 3px;
    background: var(--accent); opacity: .8;
  }
  .card:hover { transform: translateY(-3px); border-color: #3d444d; box-shadow: 0 14px 40px rgba(0,0,0,.45); }
  .card.soon { opacity: .45; pointer-events: none; }

  .ic {
    width: 52px; height: 52px; border-radius: 15px; margin-bottom: 18px;
    display: flex; align-items: center; justify-content: center;
    background: var(--tint); color: var(--accent); flex-shrink: 0;
  }
  .ic svg { width: 26px; height: 26px; }
  .t { font-size: 21px; font-weight: 600; margin-bottom: 8px; }
  .d { font-size: 14.5px; color: var(--text-secondary); line-height: 1.55; flex: 1; }
  .meta {
    display: flex; align-items: center; flex-wrap: wrap; row-gap: 6px; gap: 8px; margin-top: 20px;
    font-size: 12.5px; color: var(--text-tertiary);
  }
  .meta .go { margin-left: auto; color: var(--accent); font-weight: 500; display: flex; align-items: center; gap: 5px; }
  .meta .go svg { width: 14px; height: 14px; }
  .tag {
    font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 6px;
    background: var(--surface-high); color: var(--text-tertiary);
  }

  .foot { margin-top: 44px; font-size: 12.5px; color: var(--text-tertiary); text-align: center; line-height: 1.7; }
  .foot a { color: var(--brand-primary); text-decoration: none; }
</style>
</head>
<body>

<div class="head">
  <div class="logo">321Fit</div>
  <div class="sub">Design workspace — the prototypes, the board that maps them, and the components they are built from.</div>
  <div class="stamp" id="stamp">Design system: <code>lib/fit-ui.css</code></div>
</div>

<div class="grid" id="grid"></div>

<div class="foot">
  Everything here is static HTML — no build step, no server.<br>
  Read <a href="INDEX.md">INDEX.md</a> before building a screen: it is the map of what already exists.
</div>

<script src="board/board-data.js"></script>
<script>
// =============================================================================
// ENTRIES — add a destination by adding an entry. `count` may be a function so a
// card can report live numbers instead of a hand-typed claim that goes stale.
// =============================================================================
const B = window.FIT_BOARD;
const screens = B ? B.modules.reduce((a, m) => a + m.screens.length, 0) : null;
const shots   = B ? B.modules.reduce((a, m) => a + m.screens.reduce((b, s) => b + s.shots.length, 0), 0) : null;

const ENTRIES = [
  {
    href: 'modules.html',
    title: 'Prototype',
    accent: '#00A7D0', tint: 'rgba(0,167,208,.14)',
    desc: 'The live screens, by module and role. Click through the flows, flip states from the sidebar, read the annotations that explain why each decision went that way.',
    tag: 'coach · athlete · shared',
    count: B ? B.modules.length + ' modules' : '',
    icon: '<rect x="5" y="2" width="14" height="20" rx="3"/><path d="M10 5.5h4"/>',
  },
  {
    href: 'board.html',
    title: 'Board',
    accent: '#00E29D', tint: 'rgba(0,226,157,.14)',
    desc: 'Every screen as a real screenshot on one canvas, wired by the transitions parsed out of the files. A column per role, lanes in the order the product is used. Search it, filter by status, jump straight to the live screen.',
    tag: 'canvas · search',
    count: screens ? screens + ' screens · ' + shots + ' shots' : '',
    icon: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  },
  {
    href: 'lab/components.html',
    title: 'Components',
    accent: '#de911d', tint: 'rgba(222,145,29,.14)',
    desc: 'Every family rendered into dark and light side by side from one list, so the two cannot drift. A contrast audit measures what is actually on screen and counts what falls below AA.',
    tag: 'dark ⇄ light',
    count: 'fitting room',
    icon: '<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 000 18z" fill="currentColor" stroke="none"/>',
  },
  {
    href: 'lab/list-grammars.html',
    title: 'List grammars',
    accent: '#00E29D', tint: 'rgba(0,226,157,.14)',
    desc: 'The three ways a row can be separated from its neighbour — cards, one inset container, full bleed — drawn on the live Settings, Messages and Personal data screens. Left is what ships, right is the same markup wearing the other grammar.',
    tag: 'real screens · A ⇄ B ⇄ C',
    count: 'comparison',
    icon: '<rect x="3" y="4" width="18" height="5" rx="1.5"/><rect x="3" y="12" width="18" height="3.5" rx="1"/><rect x="3" y="18" width="18" height="3.5" rx="1"/>',
  },
  {
    href: 'lab/light-theme.html',
    title: 'Light theme lab',
    accent: '#8b5cf6', tint: 'rgba(139,92,246,.14)',
    desc: 'The palette fitting room: real screens cloned into one column per candidate light palette, with synced scroll and per-column WCAG readouts. Where the light theme was chosen.',
    tag: 'palettes · variants',
    count: 'reference',
    icon: '<path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3L4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/><circle cx="12" cy="12" r="4"/>',
  },
];

const grid = document.getElementById('grid');
for (const e of ENTRIES) {
  const a = document.createElement('a');
  a.className = 'card' + (e.soon ? ' soon' : '');
  a.href = e.soon ? '#' : e.href;
  a.style.setProperty('--accent', e.accent);
  a.style.setProperty('--tint', e.tint);
  a.innerHTML =
    '<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + e.icon + '</svg></div>' +
    '<div class="t">' + e.title + '</div>' +
    '<div class="d">' + e.desc + '</div>' +
    '<div class="meta">' + (e.tag ? '<span class="tag">' + e.tag + '</span>' : '') +
      (e.count ? '<span>' + e.count + '</span>' : '') +
      '<span class="go">' + (e.soon ? 'soon' : 'Open') +
      (e.soon ? '' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>') +
    '</span></div>';
  grid.appendChild(a);
}
if (B) document.getElementById('stamp').innerHTML =
  'Design system: <code>lib/fit-ui.css</code> · board generated ' + B.generated;
</script>
</body>
</html>
