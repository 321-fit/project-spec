<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>321Fit — Component fitting room (dark ⇄ light)</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lib/fit-ui.css">
<style>
  /* =========================================================================
     Component fitting room. One SPECS list, rendered into both themes, so the
     two panes physically cannot drift apart.

     Contrast is measured on the RENDERED elements (getComputedStyle, walking up
     for the first opaque background) — not from a palette table. That is the
     point: it audits what the components actually look like in each theme, and
     the counter in the bar says how many fail AA right now.
     ========================================================================= */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Rubik, -apple-system, sans-serif; background: #08080a; color: #ececf0; }

  .bar {
    position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px;
    padding: 12px 20px; background: rgba(8,8,10,.9); backdrop-filter: blur(12px);
    border-bottom: 1px solid #26262b;
  }
  .bar h1 { font-size: 15px; font-weight: 600; }
  .bar .sp { flex: 1; }
  .bar a, .bar button {
    font: inherit; font-size: 12px; padding: 6px 11px; border-radius: 8px;
    border: 1px solid #2b2b32; background: transparent; color: #8a8a94;
    cursor: pointer; text-decoration: none;
  }
  .bar button.on, .bar a:hover, .bar button:hover { color: #ececf0; border-color: #46464f; }
  .tally { font-size: 12px; color: #8a8a94; }
  .tally b { color: #f05c5b; }
  .tally b.zero { color: #05e0a6; }

  .jump { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 20px 0; }
  .jump a { font-size: 11.5px; color: #8a8a94; text-decoration: none; border: 1px solid #26262b; border-radius: 99px; padding: 4px 10px; }
  .jump a:hover { color: #ececf0; }

  .panes { display: flex; gap: 22px; padding: 16px 20px 80px; align-items: flex-start; }
  .pane { flex: 1; min-width: 0; max-width: 430px; border-radius: 18px; overflow: hidden; border: 1px solid #26262b; }
  .pane-head {
    padding: 10px 16px; font-size: 12px; font-weight: 600; letter-spacing: .5px;
    text-transform: uppercase; color: #8a8a94; background: #101013; border-bottom: 1px solid #26262b;
  }
  /* each pane is a real themed surface — same screen background the app uses */
  .stage { padding: 4px 0 22px; background: var(--fit-screen-bg); }

  .grp-title {
    padding: 22px 16px 4px; font-size: 15px; font-weight: 600; color: var(--fit-text-primary);
  }
  .spec { padding: 10px 0 4px; }
  .spec-cap {
    padding: 0 16px 6px; font-size: 10.5px; line-height: 1.45; color: var(--fit-text-tertiary);
    font-family: ui-monospace, monospace;
  }
  .spec-note { padding: 4px 16px 0; font-size: 11.5px; line-height: 1.5; color: var(--fit-text-tertiary); }
  .spec-body { padding: 0 16px; }
  .spec-body.flush { padding: 0; }

  /* --- list grammar: ours by default, Apple's under the iOS palette --------- */
  .lg-stack { display: flex; flex-direction: column; gap: 8px; }
  .lg-row {
    display: flex; align-items: center; gap: 12px; position: relative;
    padding: 13px 14px; border-radius: 12px; background: var(--fit-surface-high);
  }
  .lg-body { flex: 1; min-width: 0; }
  .lg-t { font-size: 15px; font-weight: 500; color: var(--fit-text-primary); }
  .lg-s { font-size: 13px; color: var(--fit-text-tertiary); margin-top: 2px; }
  .lg-chev { color: var(--fit-text-tertiary); flex-shrink: 0; }

  /* One container, hairlines inset past the icon — structure without an edge per row. */
  body.ios .lg-stack {
    gap: 0; border-radius: 20px; overflow: hidden; background: var(--fit-surface-high);
  }
  body.ios .lg-row { border-radius: 0; background: transparent; }
  body.ios .lg-row + .lg-row::before {
    content: ''; position: absolute; left: 58px; right: 0; top: 0;
    height: 1px; background: var(--fit-divider);
  }
  body.ios .lg-t { font: 400 var(--ios-body) var(--fit-font); letter-spacing: var(--ios-body-tr); }
  body.ios .lg-s { font: 400 var(--ios-subhead) var(--fit-font); letter-spacing: var(--ios-subhead-tr); color: var(--fit-text-secondary); }

  /* The same two grammars again, but pinned — the specimen above follows the
     palette switch, and you cannot compare two things by flipping between them. */
  .lg-stack--container { gap: 0; border-radius: 20px; overflow: hidden; background: var(--fit-surface-high); }
  .lg-stack--container .lg-row { border-radius: 0; background: transparent; }
  .lg-stack--container .lg-row + .lg-row::before {
    content: ''; position: absolute; left: 58px; right: 0; top: 0;
    height: 1px; background: var(--fit-divider);
  }

  /* Third grammar: the list IS the screen. No container, so nothing has to
     separate itself from the page — the hairline is the only edge here. The
     negative margin is how it escapes the specimen's padding; on a real screen
     it simply runs to the phone's edge. */
  .lg-bleed { margin: 0 -16px; }
  .lg-bleed .lg-row { border-radius: 0; background: transparent; padding: 11px 16px; }
  .lg-bleed .lg-row + .lg-row::before,
  .lg-bleed .lg-sec + .lg-row::before { content: none; }
  .lg-bleed .lg-row::after {
    content: ''; position: absolute; left: 62px; right: 0; bottom: 0;
    height: 1px; background: var(--fit-divider);
  }
  .lg-bleed .lg-row:last-child::after { content: none; }
  .lg-sec {
    position: sticky; top: 0; z-index: 1;
    padding: 6px 16px; font-size: 13px; font-weight: 600;
    color: var(--fit-text-secondary); background: var(--fit-screen-bg);
    border-bottom: 1px solid var(--fit-divider);   /* opaque, or rows scroll through it */
  }
  .lg-search {
    display: flex; align-items: center; gap: 8px; margin: 0 16px 8px;
    padding: 9px 12px; border-radius: 10px; background: var(--fit-surface-high);
    font-size: 15px; color: var(--fit-text-placeholder);
  }
  .lg-search svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* A field that is a row: no fill and no border of its own, because the
     container already provides both. This is the whole of Apple's answer. */
  .ie-form .lg-row { padding: 9px 14px; }
  .ie-field {
    display: block; width: 100%; margin-top: 1px; border: 0; background: transparent;
    font: 400 15px/1.4 inherit; color: var(--fit-text-primary); outline: none; padding: 0;
  }
  .ie-field::placeholder { color: var(--fit-text-placeholder); }
  .ie-form .lg-t { font-size: 12px; font-weight: 400; color: var(--fit-text-tertiary); }

  /* --- proposed corrections, toggled ---------------------------------------
     The light tints were moved to the darker accent step long ago (the light-tint
     rule), but the INK on them was left at the bright 400/500. Yellow on pale
     yellow is the result. Measured on the actual composited tint, the ink has to
     be: yellow 800, red 700, blue 700, green 800 — and teal has no passing step
     at all, the ramp stops at 600 (2.2:1). And the same turned out to be true of
     every accent: the darkest existing step lands at 4.2-4.5, i.e. exactly on the
     line. These are literals on purpose — they are the ramp steps we do not have,
     and each one is measured on the tint it actually sits on:
       yellow #7A4A06 6.4 · red #A32322 6.3 · blue #075A75 6.4
       green  #245C27 6.7 · teal #0B5D4A 6.6                                  */
  body.fixes .stage.fit-light .fit-badge-warning,
  body.fixes .stage.fit-light .fit-badge-pending,
  body.fixes .stage.fit-light .fit-badge-cash { color: #7A4A06; }
  body.fixes .stage.fit-light .fit-badge-danger,
  body.fixes .stage.fit-light .fit-badge-full { color: #A32322; }
  body.fixes .stage.fit-light .fit-badge-info,
  body.fixes .stage.fit-light .fit-badge-group,
  body.fixes .stage.fit-light .fit-badge-special { color: #075A75; }
  body.fixes .stage.fit-light .fit-badge-success,
  body.fixes .stage.fit-light .fit-badge-joined { color: #245C27; }
  body.fixes .stage.fit-light .fit-badge-accent { color: #0B5D4A; }

  /* Icon plates take the same ink. The brand plate also had a teal fill with a
     BLUE icon — the two were simply out of sync. */
  body.fixes .stage.fit-light .fit-icon-plate--brand,
  body.fixes .stage.fit-light .fit-icon-plate--success { color: #0B5D4A; }
  body.fixes .stage.fit-light .fit-icon-plate--warning { color: #7A4A06; }
  body.fixes .stage.fit-light .fit-icon-plate--error { color: #A32322; }

  /* The quiet ladder, one ramp step down each (gray-500 → 600, 400 → 500).
     Plus the two inks that only exist as brand/error fills today: used as TEXT on
     light they measure 2.5 and 2.9, so light needs its own tone for each. */
  body.fixes .stage.fit-light {
    --fit-text-tertiary: #5b6269;
    --fit-text-placeholder: #757e87;
    --fit-text-error: #A32322;
    --fit-brand-primary: #0B5D4A;   /* brand as INK, not as fill */
  }

  /* These six ignore the token layer and carry their own literal, so the fitting
     has to name them one by one. That is the "87 rules" finding made concrete:
     every one of these is a component that cannot be re-themed from tokens. */
  body.fixes .stage.fit-light .fit-input-error-text,
  body.fixes .stage.fit-light .fit-input-counter.at-limit,
  body.fixes .stage.fit-light .fit-banner--error .fit-banner-title,
  body.fixes .stage.fit-light .fit-btn-destructive,
  body.fixes .stage.fit-light .fit-btn-destructive--low,
  body.fixes .stage.fit-light .fit-btn-destructive--minimal { color: #A32322; }
  body.fixes .stage.fit-light .fit-stat-strip-value--accent { color: #0B5D4A; }

  /* ---- the boundary half of the fixes -------------------------------------
     Every remaining light failure is one problem wearing three costumes: a
     near-white control on a near-white page has nothing to be seen by. Input,
     icon button and toggle are therefore ONE decision, not three. A 1px
     #8E8E93 hairline is the cheapest thing that clears 3.0 on all of them at
     once — iOS's own separator (#C6C6C8, 1.6) does not, which is why their
     fields lean on a grouped container instead of standing alone on the page. */
  body.fixes .stage { --fit-control-edge: #868D96; }   /* dark: lighter than the fill */
  body.fixes .stage.fit-light { --fit-control-edge: #71757B; } /* light: darker than it */
  /* The fill says "you may type here", the hairline says "here is where".
     Ours had the field DARKER than the card it sits on — an editable thing
     recessed below a read-only one, which is why it read as disabled. */
  body.fixes .stage.fit-light .fit-input,
  body.fixes .stage.fit-light .fit-input-ta,
  body.fixes .stage.fit-light .fit-textarea { background: #FFFFFF; }
  body.fixes .stage .fit-input,
  body.fixes .stage .fit-input-ta,
  body.fixes .stage .fit-icon-btn,
  body.fixes .stage .fit-textarea { border: 1px solid var(--fit-control-edge); }
  body.fixes .stage .fit-input:focus,
  body.fixes .stage .fit-input-ta:focus { border-color: var(--fit-brand-primary); }
  /* The off track keeps its pale fill — darkening it to pass would read as ON.
     The hairline does the seeing, the knob keeps saying which side it is on. */
  body.fixes .stage .fit-toggle {
    box-shadow: inset 0 0 0 1px var(--fit-control-edge);
  }
  body.fixes .stage .fit-toggle:not(.on)::after,
  body.fixes .stage .fit-toggle:not(.on) .fit-toggle-knob {
    box-shadow: 0 1px 2px rgba(0,0,0,.28);
  }

  /* Dark had the mirror of the same defect: the tint went dark, the ink stayed
     at the mid ramp step, and everything landed at 4.1–4.5 — a hair short. One
     step lighter clears it without touching the hue. */
  body.fixes .stage:not(.fit-light) .fit-badge-danger,
  body.fixes .stage:not(.fit-light) .fit-badge-full,
  body.fixes .stage:not(.fit-light) .fit-btn-destructive,
  body.fixes .stage:not(.fit-light) .fit-btn-destructive--low,
  body.fixes .stage:not(.fit-light) .fit-btn-destructive--minimal,
  body.fixes .stage:not(.fit-light) .fit-banner--error .fit-banner-title { color: #FF9A94; }
  body.fixes .stage:not(.fit-light) .fit-badge-cash,
  body.fixes .stage:not(.fit-light) .fit-badge-warning,
  body.fixes .stage:not(.fit-light) .fit-badge-pending { color: #FFD98A; }
  body.fixes .stage:not(.fit-light) .fit-badge-joined,
  body.fixes .stage:not(.fit-light) .fit-badge-success { color: #8CE8A6; }
  body.fixes .stage:not(.fit-light) { --fit-text-placeholder: #939CA5; }
  body.fixes .stage.fit-light { --fit-text-placeholder: #666E76; }

  /* contrast badges, injected by the audit */
  .cx {
    display: inline-flex; align-items: center; gap: 4px; margin-left: 6px;
    font-family: ui-monospace, monospace; font-size: 9.5px; font-weight: 600;
    padding: 1px 5px; border-radius: 4px; vertical-align: middle;
  }
  .cx.good { color: #05e0a6; background: rgba(5,224,166,.12); }
  .cx.ok   { color: #de911d; background: rgba(222,145,29,.14); }
  .cx.bad  { color: #f05c5b; background: rgba(240,92,91,.14); }
  body:not(.audit) .cx { display: none; }

  /* ---------------------------------------------------------------------------
     iOS 26, read out of Apple's own kit on 2026-08-19 — not from memory.
     Numbers and provenance: specs/ios26-reference.md
     Brand colours stay OURS; this borrows neutrals, type and metrics.
     --------------------------------------------------------------------------- */
  body.ios .stage {
    --fit-font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro', system-ui, sans-serif;

    /* the real scale: size / line-height / tracking. Emphasized is 590, not 600. */
    --ios-large-title: 34px/41px;   --ios-large-title-tr: 0.40px;
    --ios-title1: 28px/34px;        --ios-title1-tr: 0.38px;
    --ios-title2: 22px/28px;        --ios-title2-tr: -0.26px;
    --ios-title3: 20px/25px;        --ios-title3-tr: -0.45px;
    --ios-headline: 17px/22px;      --ios-headline-tr: -0.43px;
    --ios-body: 17px/22px;          --ios-body-tr: -0.43px;
    --ios-callout: 16px/21px;       --ios-callout-tr: -0.31px;
    --ios-subhead: 15px/20px;       --ios-subhead-tr: -0.23px;
    --ios-footnote: 13px/18px;      --ios-footnote-tr: -0.08px;
    --ios-caption1: 12px/16px;      --ios-caption1-tr: 0px;
    --ios-caption2: 11px/13px;      --ios-caption2-tr: 0.06px;
  }
  body.ios .stage.fit-light {
    /* --fit-screen-bg is left to the Canvas control so the two can be judged together */
    --fit-surface:          #FFFFFF;                 /* Backgrounds/Primary */
    --fit-surface-high:     #FFFFFF;
    --fit-surface-higher:   #F2F2F7;
    --fit-surface-low:      rgba(120,120,128,0.12);  /* tertiary fill */
    --fit-text-primary:     #000000;                 /* Labels/Primary */
    --fit-text-secondary:   rgba(60,60,67,0.60);
    --fit-text-tertiary:    rgba(60,60,67,0.30);
    --fit-text-placeholder: rgba(60,60,67,0.30);
    --fit-divider:          rgba(60,60,67,0.29);     /* Separators/Non-opaque */
    --ios-elevated:         #FFFFFF;                 /* light has no separate elevated set */
    --ios-fill-control:     rgba(120,120,128,0.12);  /* Fills/Tertiary — controls, not canvas */
  }
  body.ios .stage.fit-dark {
    --fit-screen-bg:        #000000;                 /* exact, from the kit */
    --fit-surface:          #1C1C1E;
    --fit-surface-high:     #1C1C1E;
    --fit-surface-higher:   #2C2C2E;
    --fit-surface-low:      rgba(120,120,128,0.24);
    --fit-text-primary:     #FFFFFF;
    --fit-text-secondary:   rgba(235,235,245,0.70);  /* #ebebf5b2 */
    --fit-text-tertiary:    rgba(235,235,245,0.30);  /* #ebebf54d */
    --fit-text-placeholder: rgba(235,235,245,0.30);
    --fit-divider:          rgba(255,255,255,0.17);  /* #ffffff2b */
    /* Dark carries a whole ELEVATED set for sheets and popovers — a level we do
       not have at all. Base #000/#1c1c1e/#2c2c2e, elevated #1c1c1e/#2c2c2e/#3a3a3c. */
    --ios-elevated:         #2C2C2E;
    --ios-fill-control:     rgba(120,120,128,0.24);
  }

  /* Sheets sit on the elevated set, not on the same surface as the page behind. */
  body.ios .stage .fit-sheet { background: var(--ios-elevated); }
  /* Fills are for controls that hold content — fields, chips, segmented — never
     for the page or a card. That is what the "A" on Apple's fill swatches means. */
  body.ios .stage .fit-chip:not(.selected) { background: var(--ios-fill-control); border-color: transparent; }

  /* fit-ui.css hard-codes `.fit-dark .fit-input { background: var(--fit-black) }`
     (line 447) and the same for .fit-input-ta (1560) — those rules bypass
     --fit-surface-low entirely, so swapping the token does nothing in dark.
     Overridden here, and logged in specs/theme-contrast.md as a real defect:
     a component that ignores its own token in one theme cannot be re-themed. */
  body.ios .stage.fit-dark .fit-input,
  body.ios .stage.fit-dark .fit-input-ta { background: rgba(120,120,128,0.24); }

  /* Type roles. Tracking is the half of this that nobody notices and everybody
     feels: ours is 0 everywhere, Apple's flips sign with size. */
  body.ios .stage { font: var(--ios-body) var(--fit-font); letter-spacing: var(--ios-body-tr); }
  body.ios .stage .fit-header-title,
  body.ios .stage .fit-card-title { font: 590 var(--ios-headline) var(--fit-font); letter-spacing: var(--ios-headline-tr); }
  body.ios .stage .fit-btn { font: 590 var(--ios-body) var(--fit-font); letter-spacing: var(--ios-body-tr); }
  body.ios .stage .fit-input,
  body.ios .stage .fit-input-ta { font: 400 var(--ios-body) var(--fit-font); letter-spacing: var(--ios-body-tr); }
  body.ios .stage .fit-input-label,
  body.ios .stage .fit-input-counter,
  body.ios .stage .fit-input-error-text,
  body.ios .stage .spec-cap { font: 400 var(--ios-footnote) var(--fit-font); letter-spacing: var(--ios-footnote-tr); }
  body.ios .stage .fit-chip { font: 400 var(--ios-subhead) var(--fit-font); letter-spacing: var(--ios-subhead-tr); }
  body.ios .stage .fit-badge { font: 590 var(--ios-caption1) var(--fit-font); letter-spacing: var(--ios-caption1-tr); }
  body.ios .stage .fit-stat-strip-value { font: 700 var(--ios-title2) var(--fit-font); letter-spacing: var(--ios-title2-tr); }
  body.ios .stage .fit-stat-strip-label { font: 400 var(--ios-caption1) var(--fit-font); letter-spacing: var(--ios-caption1-tr); }
  body.ios .stage .grp-title { font: 700 var(--ios-title2) var(--fit-font); letter-spacing: var(--ios-title2-tr); }

  /* iOS 26 shapes: back to capsules and large containers — our capsules already match. */
  body.ios .stage .fit-input,
  body.ios .stage .fit-input-ta { border-radius: 12px; }
  body.ios .stage .fit-chip,
  body.ios .stage .fit-badge { border-radius: 999px; }
  body.ios .stage .fit-card,
  body.ios .stage .fit-stat-strip { border-radius: 20px; }

  body.ios .pane-head::after { content: ' · iOS 26 — real type scale + neutrals + metrics · our brand'; color: #de911d; }
  body.audit .fail-mark { outline: 2px dashed #f05c5b; outline-offset: 2px; border-radius: 6px; }
</style>
</head>
<body>

<div class="bar">
  <a href="../index.html">← Start</a>
  <a href="https://github.com/321-fit/project-spec/blob/main/specs/theme-contrast.md" target="_blank">Change log ↗</a>
  <h1>Component fitting room</h1>
  <span class="tally" id="tally"></span>
  <span class="sp"></span>
  <button id="paletteBtn">Palette: ours</button>
  <button id="fixBtn" title="Proposed corrections to our light theme">Fixes: off</button>
  <button id="canvasBtn" title="How deep the light canvas sits under white cards">Canvas: F2F2F7</button>
  <button id="auditBtn">Contrast audit</button>
  <button id="onlyFail">Only failures</button>
</div>
<div class="jump" id="jump"></div>

<div class="panes">
  <div class="pane"><div class="pane-head">dark — coach default</div><div class="stage fit-dark" id="dark"></div></div>
  <div class="pane"><div class="pane-head">light — athlete default</div><div class="stage fit-light" id="light"></div></div>
</div>

<script src="../lib/fit-ui.js"></script>
<script>
// =============================================================================
// SPECS — the single source. `cap` names the real class so a fix has an address.
// =============================================================================
const SPECS = [

// ---------------------------------------------------------------- the problem
{ grp: 'Editable vs display vs disabled' },
{
  cap: 'note that exists → display row · coach/clients.html',
  note: 'A note with content is a display, so it reads like every other pushable row: filled surface, primary text, chevron. Shipped 2026-08-18, replacing a transparent outline card with tertiary text — which was our disabled recipe and was reported as “looks like you can’t tap it”.',
  html: `<div style="display:flex;gap:10px;align-items:center;padding:14px;border-radius:12px;background:var(--fit-surface-high);cursor:pointer;">
    <div style="flex:1;font-size:14px;line-height:1.5;color:var(--fit-text-primary);">Knee injury (left) — avoid high-impact jumping. Prefers morning sessions.</div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--fit-text-tertiary)" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;"><path d="M9 18l6-6-6-6"/></svg></div>`,
},
{
  cap: 'nothing there yet → action row · coach/clients.html',
  note: 'Empty means there is nothing to display, so it is an action: filled surface, brand label, plus sign. Same shipped pass.',
  html: `<button style="width:100%;display:flex;align-items:center;gap:9px;padding:14px;border-radius:12px;border:none;background:var(--fit-surface-high);color:var(--fit-brand-primary);font-family:var(--fit-font);font-size:15px;font-weight:500;cursor:pointer;text-align:left;">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add notes</button>`,
},
{
  cap: 'editing it → .fit-input-ta',
  note: 'On the editor screen the field is a field: a filled surface says “type in me”.',
  html: `<textarea class="fit-input-ta" rows="3" placeholder="Injuries, preferences, payment habits…"></textarea>`,
},
{
  cap: '.fit-btn.fit-btn-disabled — what disabled must stay',
  note: 'The rule this pass produced: outline + tertiary text is reserved for inactive. Anything tappable needs a fill, a brand label, or a chevron.',
  html: `<button class="fit-btn fit-btn-disabled">Disabled button</button>`,
},

// ------------------------------------------------- the input edge, candidates
{ grp: 'Input edge — pick one' },

// render — identical markup into both themed stages
// =============================================================================
const jump = document.getElementById('jump');
for (const pane of ['dark', 'light']) {
  const stage = document.getElementById(pane);
  for (const s of SPECS) {
    if (s.grp) {
      const t = document.createElement('div');
      t.className = 'grp-title';
      t.id = pane + '-' + s.grp.replace(/[^a-z0-9]+/gi, '-').toLowerCase();
      t.textContent = s.grp;
      stage.appendChild(t);
      if (pane === 'dark') {
        const a = document.createElement('a');
        a.href = '#' + t.id;
        a.textContent = s.grp.split(' — ')[0];
        jump.appendChild(a);
      }
      continue;
    }
    const wrap = document.createElement('div');
    wrap.className = 'spec';
    wrap.innerHTML =
      '<div class="spec-cap">' + s.cap + '</div>' +
      '<div class="spec-body">' + s.html + '</div>' +
      (s.note ? '<div class="spec-note">' + s.note + '</div>' : '');
    stage.appendChild(wrap);
  }
}

// =============================================================================
// contrast audit — measured on the rendered result, per theme
// =============================================================================
function parseRGB(str) {
  const m = str.match(/[\d.]+/g);
  if (!m) return null;
  const a = m.length > 3 ? parseFloat(m[3]) : 1;
  return { r: +m[0], g: +m[1], b: +m[2], a };
}
function over(fg, bg) {                       // flatten a translucent colour
  return { r: fg.r * fg.a + bg.r * (1 - fg.a), g: fg.g * fg.a + bg.g * (1 - fg.a), b: fg.b * fg.a + bg.b * (1 - fg.a), a: 1 };
}
function lum(c) {
  const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(c.r) + 0.7152 * f(c.g) + 0.0722 * f(c.b);
}
function ratio(a, b) {
  const [l1, l2] = [lum(a), lum(b)].sort((x, y) => y - x);
  return (l1 + 0.05) / (l2 + 0.05);
}
// Gradient stops, so a gradient CTA is measured against its own fill instead of
// the page behind it. Without this the primary button falsely passes on dark and
// falsely fails on light — the loudest component in the app, reported wrong.
function gradientStops(bgImage) {
  if (!bgImage || bgImage === 'none') return null;
  const stops = bgImage.match(/rgba?\([^)]+\)/g);
  return stops && stops.length ? stops.map(parseRGB).filter(Boolean) : null;
}
// the first opaque background above this node, flattening anything translucent.
// A gradient stop can be translucent too (our selection tint is rgba(...,.2)) —
// taking such a stop at face value reads a pale mint wash as solid mint and
// invents a failure. So the stops are flattened over whatever is behind them,
// which means the walk cannot stop at a gradient unless the gradient is opaque.
function bgOf(el, fg) {
  const layers = [];
  for (let n = el; n && n !== document.documentElement; n = n.parentElement) {
    const cs = getComputedStyle(n);
    const g = gradientStops(cs.backgroundImage);
    if (g) {
      layers.push({ stops: g });
      if (g.every((c) => c.a === 1)) break;
      continue;
    }
    const c = parseRGB(cs.backgroundColor);
    if (!c || c.a === 0) continue;
    layers.push(c);
    if (c.a === 1) break;
  }
  let out = { r: 8, g: 8, b: 10, a: 1 };
  for (let i = layers.length - 1; i >= 0; i--) {          // back to front
    const l = layers[i];
    if (l.stops) {
      const flat = l.stops.map((c) => (c.a < 1 ? over(c, out) : c));
      out = fg ? flat.reduce((a, c) => (ratio(fg, c) < ratio(fg, a) ? c : a)) : flat[0];
    } else {
      out = l.a < 1 ? over(l, out) : l;
    }
  }
  return out;
}
// AA: 4.5 for body text, 3.0 once it is large or bold
function threshold(cs) {
  const px = parseFloat(cs.fontSize), w = parseInt(cs.fontWeight) || 400;
  return (px >= 24 || (px >= 18.66 && w >= 700)) ? 3 : 4.5;
}
// --- non-text contrast (WCAG 1.4.11) -----------------------------------------
// Only two questions are worth asking, and only of controls:
//   boundary — can you tell the control apart from the page behind it?
//   state    — can you tell its two states apart from each other?
// Badges and icon plates are labels, not controls: their legibility is the text
// contrast already measured, so putting them here only produced noise.
const UI_SEL = '.fit-toggle, .fit-input, .fit-input-ta, .fit-icon-btn';
function fillOf(el, cs) {
  if (cs.backgroundImage && cs.backgroundImage !== 'none') return null;   // a gradient is unmistakably a fill
  const own = parseRGB(cs.backgroundColor);
  const behind = bgOf(el.parentElement);
  if (!own || own.a === 0) return behind;
  return own.a < 1 ? over(own, behind) : own;
}
function flag(el, text) {
  el.classList.add('fail-mark');
  const b = document.createElement('span');
  b.className = 'cx bad';
  b.textContent = text;
  el.appendChild(b);
}
function auditUI(stage) {
  let fails = 0;
  stage.querySelectorAll(UI_SEL).forEach(el => {
    const cs = getComputedStyle(el);
    if (cs.boxShadow && cs.boxShadow !== 'none') return;      // a shadow is the edge — how light draws cards
    const fill = fillOf(el, cs);
    if (!fill) return;
    const behind = bgOf(el.parentElement);
    const bw = parseFloat(cs.borderTopWidth) || 0;
    const bc = parseRGB(cs.borderTopColor);
    const edge = Math.max(
      ratio(fill, behind),
      bw > 0 && bc && bc.a > 0 ? ratio(bc.a < 1 ? over(bc, fill) : bc, fill) : 0
    );
    if (edge < 3) { fails++; flag(el, 'edge ' + edge.toFixed(1) + '/3'); }
  });
  // state pairs: off vs on has to be distinguishable, or the switch says nothing
  for (const [a, b, name] of [['.fit-toggle:not(.on)', '.fit-toggle.on', 'toggle off/on'],
                              ['.fit-chip:not(.selected)', '.fit-chip.selected', 'chip un/selected']]) {
    const ea = stage.querySelector(a), eb = stage.querySelector(b);
    if (!ea || !eb) continue;
    const fa = fillOf(ea, getComputedStyle(ea)), fb = fillOf(eb, getComputedStyle(eb));
    if (!fa || !fb) continue;
    const r = ratio(fa, fb);
    if (r < 3) { fails++; flag(eb, name + ' ' + r.toFixed(1) + '/3'); }
  }
  return fails;
}

function audit() {
  let fails = { dark: 0, light: 0 };
  for (const pane of ['dark', 'light']) {
    const stage = document.getElementById(pane);
    stage.querySelectorAll('.cx').forEach(x => x.remove());
    stage.querySelectorAll('.fail-mark').forEach(x => x.classList.remove('fail-mark'));
    stage.querySelectorAll('.spec-body *').forEach(el => {
      const own = [...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim());
      if (!own) return;
      const cs = getComputedStyle(el);
      const fg = parseRGB(cs.color);
      if (!fg) return;
      const bg = bgOf(el, fg);
      const r = ratio(fg.a < 1 ? over(fg, bg) : fg, bg);
      const need = threshold(cs);
      const cls = r >= need ? 'good' : r >= need - 1.5 ? 'ok' : 'bad';
      if (cls !== 'good') { fails[pane]++; el.classList.add('fail-mark'); }
      const b = document.createElement('span');
      b.className = 'cx ' + cls;
      b.textContent = r.toFixed(1) + (cls === 'good' ? '' : '/' + need);
      el.appendChild(b);
    });
    fails[pane] += auditUI(stage);
  }
  const t = document.getElementById('tally');
  t.innerHTML = 'below AA (text 4.5 · edges 3.0) — dark <b class="' + (fails.dark ? '' : 'zero') + '">' + fails.dark +
                '</b> · light <b class="' + (fails.light ? '' : 'zero') + '">' + fails.light + '</b>';
  return fails;
}
// Light canvas depth. White cards on #F2F2F7 separate at 1.09:1 — Apple lives with
// that because 44pt rows, 17px type and visible separators carry the structure.
// Our rows are tighter, so the canvas may need to go deeper. Pick by eye; the
// button reports what the card-to-page separation actually measures.
const CANVASES = [
  { v: '#F2F2F7', n: 'F2F2F7 · 1.09', note: 'today — iOS systemGray6' },
  { v: '#EFEFF4', n: 'EFEFF4 · 1.15', note: 'half a step deeper' },
]
let canvasIx = 0;
const fixBtn = document.getElementById('fixBtn');
fixBtn.onclick = () => {
  const on = document.body.classList.toggle('fixes');
  fixBtn.classList.toggle('on', on);
  fixBtn.textContent = 'Fixes: ' + (on ? 'on' : 'off');
  if (document.body.classList.contains('audit')) audit();
};

const canvasBtn = document.getElementById('canvasBtn');
function setCanvas(ix) {
  canvasIx = (ix + CANVASES.length) % CANVASES.length;
  const c = CANVASES[canvasIx];
  document.getElementById('light').style.setProperty('--fit-screen-bg', c.v);
  const card = { r: 255, g: 255, b: 255, a: 1 };
  canvasBtn.textContent = 'Canvas: ' + c.n;
  canvasBtn.title = c.note + ' — white card against the page';
  canvasBtn.classList.toggle('on', canvasIx !== 0);
  if (document.body.classList.contains('audit')) audit();
}
function hexToRgb(h) {
  h = h.replace('#','');
  return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16), a: 1 };
}
canvasBtn.onclick = () => setCanvas(canvasIx + 1);

// Palette fitting: swap the neutrals for Apple's and let the audit re-count.
const paletteBtn = document.getElementById('paletteBtn');
paletteBtn.onclick = () => {
  const ios = document.body.classList.toggle('ios');
  paletteBtn.classList.toggle('on', ios);
  paletteBtn.textContent = 'Palette: ' + (ios ? 'iOS' : 'ours');
  if (document.body.classList.contains('audit')) audit();
};

const auditBtn = document.getElementById('auditBtn');
auditBtn.onclick = () => {
  const on = document.body.classList.toggle('audit');
  auditBtn.classList.toggle('on', on);
  if (on) audit(); else document.getElementById('tally').textContent = '';
};
document.getElementById('onlyFail').onclick = function () {
  const on = document.body.classList.toggle('only-fail');
  this.classList.toggle('on', on);
  document.querySelectorAll('.spec').forEach(s => {
    s.style.display = on && !s.querySelector('.cx.bad, .cx.ok') ? 'none' : '';
  });
};
// Off by default — turn it on when you are looking for it.
</script>
