<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>321Fit — Prototype board</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --lane: #131316;
    --line: #2b2b32;
    --txt: #ececf0;
    --dim: #8a8a94;
    --teal: #05e0a6;
    --blue: #03b2e2;
    --amber: #de911d;
    --red: #f05c5b;
    --card-w: 200px;
    --img-h: 433px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Rubik, -apple-system, sans-serif;
    background: var(--bg); color: var(--txt);
    height: 100vh; overflow: hidden;
  }

  /* ---------- top bar ---------- */
  .bar {
    position: fixed; inset: 0 0 auto 0; z-index: 20; height: 52px;
    display: flex; align-items: center; gap: 14px; padding: 0 16px;
    background: rgba(10,10,10,0.86); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .bar h1 { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .bar .meta { font-size: 11px; color: var(--dim); white-space: nowrap; }
  .bar .spacer { flex: 1; }
  .home {
    display: flex; align-items: center; gap: 6px; font: inherit; font-size: 12px;
    padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--dim); cursor: pointer; text-decoration: none;
  }
  .home:hover { color: var(--txt); border-color: #3a3a42; }
  #q {
    width: 220px; font: inherit; font-size: 12px; color: var(--txt);
    padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: #17171a; outline: none;
  }
  #q:focus { border-color: #3a3a42; }
  .chips { display: flex; gap: 6px; }
  .chip {
    font: inherit; font-size: 11px; font-weight: 500; cursor: pointer;
    padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--dim);
    display: flex; align-items: center; gap: 6px;
  }
  .chip.on { color: var(--txt); border-color: #46464f; background: #1d1d21; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .zoom { display: flex; align-items: center; gap: 2px; }
  .zoom button {
    width: 28px; height: 28px; font: inherit; font-size: 14px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--dim);
  }
  .zoom button:first-child { border-radius: 8px 0 0 8px; }
  .zoom button:last-child { border-radius: 0 8px 8px 0; }
  .zoom button:hover { color: var(--txt); }
  .zoom .pct { font-size: 11px; color: var(--dim); width: 40px; text-align: center; }

  /* ---------- left navigation ---------- */
  .navbtn {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    border-radius: 8px; border: 1px solid var(--line); background: transparent;
    color: var(--dim); cursor: pointer; flex-shrink: 0;
  }
  .navbtn:hover { color: var(--txt); }
  .navbtn.on { color: var(--txt); background: #1d1d21; border-color: #46464f; }

  #nav {
    position: fixed; z-index: 15; top: 52px; bottom: 0; left: 0; width: 268px;
    background: #101013; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
    transition: width .2s ease;
  }
  body.nav-rail #nav { width: 46px; }
  #nav .scroll { flex: 1; overflow-y: auto; padding: 12px 10px 18px; }
  #nav .scroll::-webkit-scrollbar { width: 5px; }
  #nav .scroll::-webkit-scrollbar-thumb { background: #2e2e36; border-radius: 3px; }
  body.nav-rail #nav .scroll, body.nav-rail .nav-foot { display: none; }

  /* collapsed rail — one chip per module, click expands and flies there */
  .rail { display: none; flex-direction: column; align-items: center; gap: 7px;
          padding: 12px 0; overflow-y: auto; }
  .rail::-webkit-scrollbar { width: 0; }
  .rail-role { font-size: 8.5px; letter-spacing: .5px; text-transform: uppercase; color: #4c4c56; margin-top: 6px; }
  body.nav-rail .rail { display: flex; }
  .rail-chip {
    width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: #17171a; color: var(--dim);
    font: inherit; font-size: 10.5px; font-weight: 600; letter-spacing: -0.2px;
  }
  .rail-chip:hover { color: var(--txt); border-color: #46464f; }
  .rail-sep { width: 18px; height: 1px; background: var(--line); margin: 2px 0; }

  .nav-role {
    width: 100%; font: inherit; font-size: 9.5px; letter-spacing: .6px;
    text-transform: uppercase; color: #6d6d79; background: transparent;
    border: none; cursor: pointer; text-align: left;
    padding: 15px 8px 6px; display: flex; align-items: center; gap: 6px;
  }
  .nav-role:hover { color: var(--txt); }
  .nav-role .n { margin-left: auto; color: #3d3d46; }
  .nav-tools {
    display: flex; gap: 6px; padding: 2px 2px 8px;
    border-bottom: 1px solid var(--line); margin-bottom: 4px;
  }
  .nav-tools button {
    flex: 1; font: inherit; font-size: 10.5px; cursor: pointer;
    padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line);
    background: transparent; color: var(--dim);
  }
  .nav-tools button:hover { color: var(--txt); border-color: #46464f; }
  .nav-mod { margin-bottom: 2px; }
  .nav-mod-head {
    width: 100%; display: flex; align-items: center; gap: 7px; text-align: left;
    font: inherit; cursor: pointer; background: transparent; border: none;
    color: var(--txt); padding: 7px 8px; border-radius: 8px;
  }
  .nav-mod-head:hover { background: #1a1a1f; }
  .nav-mod-head b {
    font-size: 12.5px; font-weight: 500; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .nav-mod-head .n { font-size: 10px; color: #55555f; flex-shrink: 0; }
  .nav-mod-head { padding: 5px 8px; }
  .chev {
    flex-shrink: 0; color: #6d6d79; transition: transform .16s ease;
  }
  .collapsed > .nav-mod-head .chev, .collapsed > .nav-role .chev { transform: rotate(-90deg); }
  .nav-mod-body, .nav-sec-body { overflow: hidden; }
  .collapsed > .nav-mod-body, .collapsed > .nav-sec-body { display: none; }
  /* a match must never hide inside a folded branch */
  body.searching .collapsed > .nav-mod-body,
  body.searching .collapsed > .nav-sec-body { display: block; }
  /* while filtering, the panel shows only what matched — on the canvas misses
     stay faded in place, because there position is the information */
  body.searching .nav-item.faded,
  body.searching .nav-mod.no-hit,
  body.searching .nav-sec.no-hit { display: none; }
  .aim {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px; border: none;
    background: transparent; color: #55555f; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .aim:hover { background: #26262d; color: var(--teal); }
  .nav-item {
    width: 100%; display: flex; align-items: center; gap: 8px;
    font: inherit; font-size: 12px; cursor: pointer; text-align: left;
    background: transparent; border: none; color: #b6b6c0;
    padding: 7px 10px 7px 12px; border-radius: 8px;
  }
  .nav-item:hover { background: #1a1a1f; color: var(--txt); }
  .nav-item.faded { opacity: 0.28; }
  .nav-item.sel { background: #1d1d21; color: var(--txt); box-shadow: inset 2px 0 0 var(--teal); }
  .nav-item .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .nav-item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item .tag {
    font-size: 9px; color: var(--dim); border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 4px; flex-shrink: 0;
  }
  .nav-foot {
    border-top: 1px solid var(--line); padding: 10px 14px 12px;
    font-size: 10.5px; color: #55555f; line-height: 1.7;
  }
  .nav-foot .k {
    display: inline-block; min-width: 15px; text-align: center;
    border: 1px solid var(--line); border-radius: 4px; padding: 0 3px;
    color: var(--dim); margin-right: 5px;
  }

  /* ---------- canvas ---------- */
  #viewport {
    position: absolute; inset: 52px 0 0 0; overflow: hidden;
    transition: left .22s ease;
    cursor: grab; background:
      radial-gradient(circle at 1px 1px, #1a1a1e 1px, transparent 0) 0 0/28px 28px;
  }
  #viewport.dragging { cursor: grabbing; }
  #viewport { left: 268px; }
  body.nav-rail #viewport { left: 46px; }
  #canvas { position: absolute; transform-origin: 0 0; }
  #canvas.smooth { transition: transform .3s cubic-bezier(.4,0,.2,1); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(5,224,166,0); }
    30%      { box-shadow: 0 0 0 5px rgba(5,224,166,0.55); }
  }
  .card.pulse { animation: pulse 1.1s ease 2; border-color: var(--teal) !important; }

  .lane { position: absolute; }
  .role-head {
    position: absolute; top: -112px; font-size: 46px; font-weight: 600;
    letter-spacing: 2px; text-transform: uppercase; color: #2f2f37;
    pointer-events: none;
  }
  .lane-head {
    position: absolute; top: -46px; left: 0;
    display: flex; align-items: baseline; gap: 10px; white-space: nowrap;
  }
  .lane-head b { font-size: 17px; font-weight: 600; }
  .lane-head span { font-size: 12px; color: var(--dim); }
  .lane-box {
    position: absolute; inset: -24px -28px -28px -28px;
    border: 1px solid var(--line); border-radius: 20px; background: var(--lane);
  }
  .level-tag {
    position: absolute; top: -22px; font-size: 11px; letter-spacing: 0.6px;
    text-transform: uppercase; color: #6d6d79;
  }

  svg.wires { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .wire { fill: none; stroke: #3d3d46; stroke-width: 1.5px; }
  .wire.back { stroke: #2b2b33; stroke-dasharray: 4 5; }
  .wire.hot { stroke: var(--teal); stroke-width: 2px; }
  .arrow { fill: #3d3d46; }
  .arrow.hot { fill: var(--teal); }

  /* ---------- cards ---------- */
  .cell { position: absolute; display: flex; gap: 14px; align-items: flex-start; }
  .card {
    position: relative; width: var(--card-w); flex: 0 0 var(--card-w);
    border-radius: 12px; overflow: hidden; background: #17171a;
    border: 1px solid var(--line); cursor: pointer;
    transition: border-color .12s, transform .12s;
  }
  .card:hover { border-color: #55555f; transform: translateY(-2px); }
  .card.faded { opacity: 0.12; pointer-events: none; }
  .card img { display: block; width: 100%; height: var(--img-h); object-fit: cover; object-position: top; }
  .cap { padding: 8px 10px 9px; border-top: 1px solid var(--line); }
  .cap .t { font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .cap .t .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .cap .s { font-size: 10px; color: var(--dim); margin-top: 2px; font-family: ui-monospace, monospace; }
  .card.state .cap .t { color: var(--dim); font-weight: 400; }
  .card.state img { opacity: 0.92; }
  .badge {
    position: absolute; top: 8px; left: 8px; font-size: 9px; font-weight: 600;
    letter-spacing: 0.4px; text-transform: uppercase; padding: 3px 7px;
    border-radius: 5px; background: rgba(0,0,0,0.72); backdrop-filter: blur(4px);
  }
  .ext { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
  .ext a {
    font-size: 9.5px; color: var(--dim); text-decoration: none;
    border: 1px solid var(--line); border-radius: 5px; padding: 2px 5px;
    white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }
  .ext a:hover { color: var(--blue); border-color: #2f4a55; }
  .ext a.in { color: #7d7d88; border-style: dashed; }
  .ext a.in:hover { color: var(--teal); border-color: #2f5548; }

  .note {
    position: fixed; z-index: 30; max-width: 300px; display: none;
    padding: 10px 12px; border-radius: 10px; background: #1d1d21;
    border: 1px solid #33333b; box-shadow: 0 14px 40px rgba(0,0,0,0.6);
    font-size: 12px; line-height: 1.45; color: #c9c9d2;
  }
  .note b { display: block; color: var(--txt); font-size: 12px; margin-bottom: 4px; }

  .hint {
    position: fixed; bottom: 14px; left: 16px; z-index: 20;
    font-size: 11px; color: #55555f; transition: left .22s ease;
  }
  .hint { left: 284px; }
  body.nav-rail .hint { left: 62px; }
</style>
</head>
<body>

<div class="bar">
  <button class="navbtn" id="navToggle" title="Screens (\)">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="home" href="./index.html">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    Start
  </a>
  <h1>Prototype board</h1>
  <span class="meta" id="meta"></span>
  <input id="q" placeholder="Search screens…" autocomplete="off">
  <div class="chips" id="statusChips"></div>
  <button class="chip" id="orphanToggle" title="Screens no in-app route reaches"></button>
  <button class="chip" id="backToggle">Back arrows</button>
  <div class="spacer"></div>
  <div class="zoom">
    <button onclick="zoomBy(-1)">−</button>
    <span class="pct" id="pct">100%</span>
    <button onclick="zoomBy(1)">+</button>
    <button onclick="fitWidth()" style="width:auto;padding:0 9px;font-size:11px;" title="Fit the width — the board is 73 000px tall, fitting the height would make every screen a speck">Fit</button>
  </div>
</div>

<nav id="nav">
  <div class="rail" id="railList"></div>
  <div class="scroll" id="navList"></div>
  <div class="nav-foot">
    <span class="k">\</span>rail / full panel<br>
    <span class="k">/</span>search · <span class="k">esc</span>clear
  </div>
</nav>

<div id="viewport"><div id="canvas"></div></div>
<div class="note" id="note"></div>
<div class="hint">Scroll to pan · ⌘/Ctrl + scroll to zoom · drag the canvas · click a screen to open the live prototype · <b>\</b> screen list</div>

<script src="./board/board-data.js?v=ab0a788f62"></script>
<script>
// ---------------------------------------------------------------------------
// Layout constants. Positions are computed from the graph — nothing is authored.
// ---------------------------------------------------------------------------
const CARD_W = 200, IMG_H = 433, CAP_H = 46, CARD_GAP = 14;
const COL_GAP = 150, ROW_GAP = 48, LANE_GAP = 140;
const ROWS_PER_COL = 6, SUB_GAP = 44;   // an overfull level wraps into sub-columns

const STATUS = {
  shipped:  { c: '#05e0a6', label: 'shipped'  },
  canon:    { c: '#03b2e2', label: 'canon'    },
  proposal: { c: '#de911d', label: 'proposal' },
  legacy:   { c: '#6b6b76', label: 'legacy'   },
  unmarked: { c: '#f05c5b', label: 'unmarked' },
};

const data = window.FIT_BOARD;
const canvas = document.getElementById('canvas');
const viewport = document.getElementById('viewport');
const noteEl = document.getElementById('note');
let showBack = false;
const offStatus = new Set();

document.getElementById('meta').textContent =
  data.modules.length + ' module' + (data.modules.length > 1 ? 's' : '') + ' · ' +
  data.modules.reduce((a, m) => a + m.screens.length, 0) + ' screens · generated ' + data.generated;

// ---------- status filter chips ----------
const chipWrap = document.getElementById('statusChips');
const present = [...new Set(data.modules.flatMap(m => m.screens.map(s => s.status)))];
for (const st of present) {
  const b = document.createElement('button');
  b.className = 'chip on';
  b.innerHTML = '<span class="dot" style="background:' + (STATUS[st] || STATUS.unmarked).c + '"></span>' + st;
  b.onclick = () => {
    offStatus.has(st) ? offStatus.delete(st) : offStatus.add(st);
    b.classList.toggle('on', !offStatus.has(st));
    applyFilter();
  };
  chipWrap.appendChild(b);
}
document.getElementById('backToggle').onclick = function () {
  showBack = !showBack;
  this.classList.toggle('on', showBack);
  document.querySelectorAll('.wire.back, .arrow.back').forEach(w => w.style.display = showBack ? '' : 'none');
};

// ---------- build the lanes ----------
// A cell = one screen: the screen itself plus its states, laid out left→right.
// Columns are BFS levels ("how many taps in"), rows are siblings at that level.
// Two passes: build → measure → place, so a card with link chips can be taller
// than one without and nothing overlaps.
const key = (mod, id) => mod.file + '#' + id;   // screen ids repeat across files
const nodeIndex = new Map();   // "file#id" → where it sits on the canvas
const laneIndex = [];          // module index → { top, left, height, width }
const built = [];              // lanes, measured but not yet placed
let CONTENT_W = 0;
for (const mod of data.modules) {
  const lane = document.createElement('div');
  lane.className = 'lane';

  const box = document.createElement('div');
  box.className = 'lane-box';
  lane.appendChild(box);

  const head = document.createElement('div');
  head.className = 'lane-head';
  head.innerHTML = '<b>' + mod.label + '</b><span>' + mod.role + ' · ' + mod.file + ' · ' +
    mod.screens.length + ' screens · ' + mod.screens.reduce((a, s) => a + s.shots.length, 0) + ' shots</span>';
  lane.appendChild(head);

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'wires');
  lane.appendChild(svg);

  // --- pass 1: build the cells ---
  const cells = new Map();
  for (const s of mod.screens) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.style.width = (s.shots.length * CARD_W + (s.shots.length - 1) * CARD_GAP) + 'px';

    s.shots.forEach((shot, i) => {
      const st = STATUS[s.status] || STATUS.unmarked;
      const card = document.createElement('div');
      card.className = 'card' + (i ? ' state' : '');
      card.dataset.id = key(mod, s.id);
      card.dataset.search = (s.title + ' ' + s.id + ' ' + mod.label + ' ' + (shot.label || '') + ' ' + (s.note || '')).toLowerCase();
      card.dataset.status = s.status;
      if (s.orphan) card.dataset.orphan = '1';
      card.innerHTML =
        '<img loading="lazy" src="./board/shots/' + shot.file + '?v=contextual-ai-quick-starts-11" alt="">' +
        (i === 0
          ? (s.entry ? '<span class="badge" style="color:' + st.c + '">entry</span>' : '') +
            (s.orphan ? '<span class="badge" style="color:var(--dim);left:auto;right:8px" title="No in-app route reaches this screen — in the prototype it is only reachable from the sidebar. Either the wiring is missing or the product has a gap.">no way in</span>' : '')
          : '<span class="badge" style="color:var(--dim)">state</span>') +
        '<div class="cap">' +
          '<div class="t"><span class="dot" style="background:' + st.c + '"></span>' +
            (i === 0 ? s.title : shot.label) + '</div>' +
          '<div class="s">' + (i === 0 ? '#' + s.id : s.status) + '</div>' +
          (i === 0 && (s.external.length || s.inFrom)
            ? '<div class="ext">' +
                (s.inFrom || []).map(l =>
                  '<a class="in" href="#" onclick="event.stopPropagation();event.preventDefault();focusScreen(\'' +
                  l.file + '#' + l.id + '\')" title="Entered from ' + l.label + '">⇠ ' + l.label + '</a>').join('') +
                s.external.map(h =>
                  '<a href="' + resolve(mod.file, h) + '" target="_blank" onclick="event.stopPropagation()">⇢ ' +
                  h.replace(/^\.\.?\//, '').replace(/\?[^#]*/, '') + '</a>').join('') +
              '</div>'
            : '') +
        '</div>';
      card.onclick = () => window.open('./' + mod.file + '#' + s.id, '_blank');
      card.onmouseenter = (ev) => { hot(key(mod, s.id), true); if (s.note) showNote(ev, s, mod); };
      card.onmouseleave = () => { hot(key(mod, s.id), false); noteEl.style.display = 'none'; };
      cell.appendChild(card);
    });

    lane.appendChild(cell);
    cells.set(s.id, cell);
  }
  canvas.appendChild(lane);

  // --- pass 2: measure, then place ---
  const maxLevel = Math.max(...mod.screens.map(s => s.level));
  const colW = [];
  // A level with 16 screens (self-paced) would be an 8000px column nobody scrolls,
  // so an overfull level wraps into sub-columns kept tight against each other —
  // the wide gap still marks where the next tap begins.
  const subX = new Map();   // "level:sub" → x
  const colX = [];
  let x = 0;
  for (let l = 0; l <= maxLevel; l++) {
    const rows = mod.screens.filter(s => s.level === l).sort((a, b) => a.order - b.order);
    const subs = Math.max(1, Math.ceil(rows.length / ROWS_PER_COL));
    colX[l] = x;
    for (let sub = 0; sub < subs; sub++) {
      const inSub = rows.filter((_, i) => Math.floor(i / ROWS_PER_COL) === sub);
      subX.set(l + ':' + sub, x);
      x += Math.max(CARD_W, ...inSub.map(s => cells.get(s.id).offsetWidth)) + (sub + 1 < subs ? SUB_GAP : 0);
    }
    colW[l] = x - colX[l];
    if (l < maxLevel) x += COL_GAP;
  }

  const colTop = new Map();
  const pos = new Map();
  for (let l = 0; l <= maxLevel; l++) {
    const rows = mod.screens.filter(s => s.level === l).sort((a, b) => a.order - b.order);
    rows.forEach((s, i) => {
      const sub = Math.floor(i / ROWS_PER_COL);
      const cell = cells.get(s.id);
      const cx = subX.get(l + ':' + sub);
      const y = colTop.get(l + ':' + sub) || 0;
      cell.style.left = cx + 'px';
      cell.style.top = y + 'px';
      pos.set(s.id, { x: cx, y, w: cell.offsetWidth });
      colTop.set(l + ':' + sub, y + cell.offsetHeight + ROW_GAP);
      nodeIndex.set(key(mod, s.id), {
        screen: s, mod, card: cell.firstElementChild, lane,
        x: cx, y, w: cell.offsetWidth,
      });
    });
  }

  const laneW = colX[maxLevel] + colW[maxLevel];
  const laneH = Math.max(...colTop.values()) - ROW_GAP;
  lane.style.width = laneW + 'px';
  lane.style.height = laneH + 'px';
  svg.setAttribute('width', laneW); svg.setAttribute('height', laneH);
  CONTENT_W = Math.max(CONTENT_W, laneW);

  for (let l = 0; l <= maxLevel; l++) {
    const t = document.createElement('div');
    t.className = 'level-tag';
    t.style.left = colX[l] + 'px';
    t.textContent = l === 0 ? 'entry' : 'tap ' + l;
    lane.appendChild(t);
  }

  // --- wires, now that every cell has a position ---
  for (const e of mod.edges) {
    const a = pos.get(e.from), b = pos.get(e.to);
    if (!a || !b) continue;
    const x1 = a.x + a.w, y1 = a.y + IMG_H / 2;
    const x2 = b.x, y2 = b.y + IMG_H / 2;
    const dx = Math.max(60, (x2 - x1) * 0.5);
    const back = e.back;
    // a back edge leaves the left side and loops around to the target's right
    const d = back
      ? `M ${a.x} ${y1} C ${a.x - 80} ${y1}, ${b.x + b.w + 80} ${y2}, ${b.x + b.w} ${y2}`
      : `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    p.setAttribute('class', 'wire' + (back ? ' back' : ''));
    p.dataset.from = key(mod, e.from); p.dataset.to = key(mod, e.to);
    if (back) p.style.display = 'none';
    svg.appendChild(p);

    const tip = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    const hx = back ? b.x + b.w : x2;
    tip.setAttribute('points', back
      ? `${hx},${y2} ${hx + 8},${y2 - 5} ${hx + 8},${y2 + 5}`
      : `${hx},${y2} ${hx - 8},${y2 - 5} ${hx - 8},${y2 + 5}`);
    tip.setAttribute('class', 'arrow' + (back ? ' back' : ''));
    tip.dataset.from = key(mod, e.from); tip.dataset.to = key(mod, e.to);
    if (back) tip.style.display = 'none';
    svg.appendChild(tip);
  }

  built.push({ mod, lane, laneW, laneH });
}

// --- place the lanes: a column per role, stacked in flow order ---------------
// One 73 000px ribbon was unreadable; side by side you can see coach and athlete
// answer the same question differently.
const ROLE_GAP = 560;
const roles = [...new Set(data.modules.map(m => m.role))];
const roleW = new Map(roles.map(r =>
  [r, Math.max(...built.filter(b => b.mod.role === r).map(b => b.laneW))]));
const roleX = new Map();
roles.reduce((x, r) => (roleX.set(r, x), x + roleW.get(r) + ROLE_GAP), 0);

const roleY = new Map(roles.map(r => [r, 0]));
for (const b of built) {
  const x = roleX.get(b.mod.role), y = roleY.get(b.mod.role);
  b.lane.style.left = x + 'px';
  b.lane.style.top = y + 'px';
  b.top = y; b.left = x;
  roleY.set(b.mod.role, y + b.laneH + LANE_GAP);
  laneIndex.push({ top: y, left: x, height: b.laneH, width: b.laneW });
}
// lane-relative → canvas coordinates, now that every lane has a home
for (const n of nodeIndex.values()) {
  const b = built.find(x => x.lane === n.lane);
  n.x += b.left; n.y += b.top;
}
for (const r of roles) {
  const h = document.createElement('div');
  h.className = 'role-head';
  h.textContent = r;
  h.style.left = roleX.get(r) + 'px';
  h.style.width = roleW.get(r) + 'px';
  canvas.appendChild(h);
}

const CONTENT_W_ALL = roleX.get(roles[roles.length - 1]) + roleW.get(roles[roles.length - 1]);
const CONTENT_H = Math.max(...roleY.values()) - LANE_GAP;
const LANE_MAX_W = CONTENT_W;   // the widest single module — what "Fit" targets
CONTENT_W = CONTENT_W_ALL;
canvas.style.width = CONTENT_W + 'px';
canvas.style.height = CONTENT_H + 'px';

// ---------- left navigation ----------
// Two widths: a full tree (modules → tap depth → screens) and a 46px rail with
// one chip per module, so the panel never has to be fully hidden.
const NAV_W = 268, RAIL_W = 46;
const navList = document.getElementById('navList');
const railList = document.getElementById('railList');
const CHEV = '<svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

// which branches are folded — remembered between sessions
// v2: the pilot covered one module, so its saved folds would leave all 37 open.
const FOLD_KEY = 'fitBoardFolded.v2';
let folded = new Set();
try { folded = new Set(JSON.parse(localStorage.getItem(FOLD_KEY) || '[]')); } catch (e) {}
const saveFolded = () => { try { localStorage.setItem(FOLD_KEY, JSON.stringify([...folded])); } catch (e) {} };
function fold(el, key) {
  const on = el.classList.toggle('collapsed');
  on ? folded.add(key) : folded.delete(key);
  saveFolded();
}

// With 39 modules the panel needs its own structure: sections by role, and
// every module folded on first visit — you open the one you came for.
const storedFolds = (() => { try { return !!localStorage.getItem(FOLD_KEY); } catch (e) { return false; } })();
const foldByDefault = !storedFolds && data.modules.length > 8;
let lastRole = null, roleBody = navList;

const tools = document.createElement('div');
tools.className = 'nav-tools';
tools.innerHTML = '<button id="foldAll">Collapse all</button><button id="openAll">Expand all</button>';
navList.appendChild(tools);

data.modules.forEach((mod, mi) => {
  if (mod.role !== lastRole) {
    lastRole = mod.role;
    const n = data.modules.filter(m => m.role === mod.role).length;
    const sec = document.createElement('div');
    sec.className = 'nav-sec';
    const roleKey = 'r:' + mod.role;
    if (folded.has(roleKey)) sec.classList.add('collapsed');
    const rh = document.createElement('button');
    rh.className = 'nav-role';
    rh.innerHTML = CHEV + mod.role + '<span class="n">' + n + '</span>';
    rh.onclick = () => fold(sec, roleKey);
    sec.appendChild(rh);
    const rb = document.createElement('div');
    rb.className = 'nav-sec-body';
    sec.appendChild(rb);
    navList.appendChild(sec);
    roleBody = rb;

    const rr = document.createElement('div');
    rr.className = 'rail-role';
    rr.textContent = mod.role.slice(0, 2);
    railList.appendChild(rr);
  }
  const block = document.createElement('div');
  block.className = 'nav-mod';
  block.dataset.file = mod.file;
  const modKey = 'm:' + mod.file;
  if (folded.has(modKey) || foldByDefault) block.classList.add('collapsed');

  const head = document.createElement('button');
  head.className = 'nav-mod-head';
  const shots = mod.screens.reduce((a, s) => a + s.shots.length, 0);
  head.innerHTML = CHEV + '<b>' + mod.label + '</b><span class="n">' + mod.screens.length + '</span>';
  head.title = mod.file + ' — ' + mod.screens.length + ' screens, ' + shots + ' shots';
  head.onclick = () => fold(block, modKey);

  // crosshair = fit this lane, so the header click stays a pure fold
  const aim = document.createElement('button');
  aim.className = 'aim';
  aim.title = 'Fit this module';
  aim.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>';
  aim.onclick = (e) => { e.stopPropagation(); focusLane(mi); };
  head.appendChild(aim);
  block.appendChild(head);

  const body = document.createElement('div');
  body.className = 'nav-mod-body';
  block.appendChild(body);

  // Flat list, but still in flow order: entry first, then each level of depth.
  // The depth itself is already the canvas's own axis — repeating it here as
  // headers cost four rows to organise nine screens.
  for (const s of [...mod.screens].sort((a, b) => a.level - b.level || a.order - b.order)) {
    const st = STATUS[s.status] || STATUS.unmarked;
    const item = document.createElement('button');
    item.className = 'nav-item';
    item.dataset.id = key(mod, s.id);
    item.dataset.search = (s.title + ' ' + s.id + ' ' + mod.label + ' ' + (s.note || '')).toLowerCase();
    item.dataset.status = s.status;
    if (s.orphan) item.dataset.orphan = '1';
    item.innerHTML =
      '<span class="dot" style="background:' + st.c + '"></span>' +
      '<span class="nm">' + s.title + '</span>' +
      (s.shots.length > 1 ? '<span class="tag">+' + (s.shots.length - 1) + '</span>' : '') +
      (s.orphan ? '<span class="tag" style="color:var(--red);border-color:#4a2a2c">no entry</span>' : '');
    item.title = s.id + (s.entry ? ' · entry' : '') + (s.note ? ' — ' + s.note : '');
    item.onclick = () => focusScreen(key(mod, s.id));
    body.appendChild(item);
  }
  roleBody.appendChild(block);

  // rail chip: initials of the module label
  const chip = document.createElement('button');
  chip.className = 'rail-chip';
  chip.title = mod.label + ' — ' + mod.screens.length + ' screens';
  // Initials from the file name, not the label: "Coach Earnings v2" and "Coach
  // Earnings" would both read CE, while balance-v2 / balance stay apart.
  const base = mod.file.split('/').pop().replace(/\.html$/, '');
  chip.textContent = (base.includes('-')
    ? base.split('-').slice(0, 2).map(w => w[0]).join('')
    : base.slice(0, 2)).toUpperCase();
  chip.onclick = () => { setNav('full'); setTimeout(() => focusLane(mi), 210); };
  railList.appendChild(chip);
});

document.getElementById('foldAll').onclick = () => setAllFolds(true);
document.getElementById('openAll').onclick = () => setAllFolds(false);
function setAllFolds(on) {
  document.querySelectorAll('.nav-mod, .nav-sec').forEach(el => {
    el.classList.toggle('collapsed', on);
    const k = el.classList.contains('nav-sec')
      ? 'r:' + el.querySelector('.nav-role').textContent.replace(/\d+$/, '').trim()
      : 'm:' + el.dataset.file;
    on ? folded.add(k) : folded.delete(k);
  });
  saveFolded();
}

function viewSize() {
  return { w: innerWidth - (document.body.classList.contains('nav-rail') ? RAIL_W : NAV_W), h: innerHeight - 52 };
}
function glide(fn) {
  canvas.classList.add('smooth');
  fn();
  setTimeout(() => canvas.classList.remove('smooth'), 340);
}
function focusScreen(id) {
  const n = nodeIndex.get(id);
  if (!n) return;
  glide(() => {
    z = Math.max(z, 0.5);
    const v = viewSize();
    tx = v.w / 2 - (n.x + n.w / 2) * z;
    ty = v.h / 2 - (n.y + IMG_H / 2) * z;
    apply();
  });
  document.querySelectorAll('.card.pulse').forEach(c => c.classList.remove('pulse'));
  document.querySelectorAll('.nav-item.sel').forEach(i => i.classList.remove('sel'));
  const item = document.querySelector('.nav-item[data-id="' + id + '"]');
  if (item) item.classList.add('sel');
  n.card.classList.add('pulse');
  setTimeout(() => n.card.classList.remove('pulse'), 2400);
  if (n.mod && n.screen) {
    const want = linkFor(n.mod, n.screen.id);
    if (location.hash !== want) history.replaceState(null, '', want);
  }
}
// ---------------------------------------------------------------------------
// Deep links. A board URL that means "this screen" is worth more than a link to
// the prototype file, because from a screen on the board you can reach the
// prototype, the annotation and the neighbours — the other direction gives you
// only the file. Format:  board.html#<module-slug>/<screen-id>
// The hash is rewritten as you focus screens, so the address bar is always a
// link to what you are looking at.
// ---------------------------------------------------------------------------
const slugIndex = new Map(data.modules.map(m => [m.slug, m]));

function linkFor(mod, id) { return '#' + mod.slug + '/' + id; }

function focusFromHash(push) {
  const raw = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (!raw) return false;
  const cut = raw.lastIndexOf('/');
  if (cut < 1) return false;
  const mod = slugIndex.get(raw.slice(0, cut));
  const id = raw.slice(cut + 1);
  if (!mod || !mod.screens.some(s => s.id === id)) return false;
  // Every module is folded on a first visit, so a link into one has to open it
  // — otherwise the link lands you on a lane you cannot see in the panel.
  const block = document.querySelector('.nav-mod[data-file="' + mod.file + '"]');
  if (block && block.classList.contains('collapsed')) {
    block.classList.remove('collapsed');
    folded.delete('m:' + mod.file);
    saveFolded();
  }
  focusScreen(key(mod, id));
  return true;
}
window.addEventListener('hashchange', () => focusFromHash());

function focusLane(i) {
  const l = laneIndex[i];
  glide(() => {
    const v = viewSize();
    z = Math.min(1, (v.w - 120) / l.width);
    // NB: the lane's own column, not x=0 — lanes stopped being one vertical
    // ribbon when they were split per role.
    tx = 60 - l.left * z;
    ty = 70 - l.top * z;
    apply();
  });
}
const navBtn = document.getElementById('navToggle');
function setNav(mode) {
  const rail = mode === 'rail';
  document.body.classList.toggle('nav-rail', rail);
  navBtn.classList.toggle('on', !rail);
  try { localStorage.setItem('fitBoardNav', rail ? 'rail' : 'full'); } catch (e) {}
}
navBtn.onclick = () => setNav(document.body.classList.contains('nav-rail') ? 'full' : 'rail');
setNav((() => { try { return localStorage.getItem('fitBoardNav') || 'full'; } catch (e) { return 'full'; } })());

function resolve(modFile, href) {
  const dir = modFile.slice(0, modFile.lastIndexOf('/') + 1);
  return new URL(dir + href, location.href).pathname.split('/').slice(-3).join('/').replace(/^/, './');
}

function hot(id, on) {
  document.querySelectorAll('.wire, .arrow').forEach(w => {
    if (w.dataset.from === id || w.dataset.to === id) w.classList.toggle('hot', on);
  });
}

function showNote(ev, s, mod) {
  noteEl.innerHTML = '<b>' + s.title + '</b>' + s.note +
    '<div style="margin-top:7px;color:#55555f;font-size:10.5px">' + mod.label + ' · #' + s.id + '</div>';
  noteEl.style.display = 'block';
  const x = Math.min(ev.clientX + 16, innerWidth - 320);
  noteEl.style.left = x + 'px';
  noteEl.style.top = Math.min(ev.clientY + 16, innerHeight - 160) + 'px';
}

// ---------- filter ----------
const qEl = document.getElementById('q');
qEl.oninput = applyFilter;
function applyFilter() {
  const q = qEl.value.trim().toLowerCase();
  document.body.classList.toggle('searching', !!q || orphansOnly);
  document.querySelectorAll('.card, .nav-item').forEach(c => {
    const hit = (!q || c.dataset.search.includes(q)) &&
                !offStatus.has(c.dataset.status) &&
                (!orphansOnly || c.dataset.orphan === '1');
    c.classList.toggle('faded', !hit);
  });
  // a module or a role with nothing left in it drops out of the panel too
  document.querySelectorAll('.nav-mod').forEach(m =>
    m.classList.toggle('no-hit', !m.querySelector('.nav-item:not(.faded)')));
  document.querySelectorAll('.nav-sec').forEach(sec =>
    sec.classList.toggle('no-hit', !sec.querySelector('.nav-mod:not(.no-hit)')));
}
let orphansOnly = false;
const orphanBtn = document.getElementById('orphanToggle');
orphanBtn.textContent = 'No way in · ' +
  data.modules.reduce((a, m) => a + m.screens.filter(s => s.orphan).length, 0);
orphanBtn.onclick = () => {
  orphansOnly = !orphansOnly;
  orphanBtn.classList.toggle('on', orphansOnly);
  applyFilter();
};

// ---------- pan & zoom ----------
let z = 1, tx = 40, ty = 90;
function apply() {
  canvas.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + z + ')';
  document.getElementById('pct').textContent = Math.round(z * 100) + '%';
}
function zoomAt(factor, cx, cy) {
  const nz = Math.min(2, Math.max(0.06, z * factor));
  tx = cx - (cx - tx) * (nz / z);
  ty = cy - (cy - ty) * (nz / z);
  z = nz; apply();
}
function zoomBy(dir) { zoomAt(dir > 0 ? 1.2 : 1 / 1.2, innerWidth / 2, innerHeight / 2); }
function fitAll() {
  const v = viewSize();
  z = Math.min(1, (v.w - 140) / CONTENT_W, (v.h - 150) / CONTENT_H);
  tx = (v.w - CONTENT_W * z) / 2;
  ty = 100;
  apply();
}
// Opening view: fit the width and let the flow run down — a board is meant to be
// panned, and fitting the height makes every screen unreadable.
function fitWidth() {
  z = Math.min(1, (viewSize().w - 120) / LANE_MAX_W);
  tx = 60; ty = 100; apply();
}
viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const navOff = document.body.classList.contains('nav-rail') ? RAIL_W : NAV_W;
  if (e.ctrlKey || e.metaKey) zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - navOff, e.clientY - 52);
  else { tx -= e.deltaX; ty -= e.deltaY; apply(); }
}, { passive: false });

let drag = null;
viewport.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.card')) return;
  drag = { x: e.clientX - tx, y: e.clientY - ty };
  viewport.classList.add('dragging');
  viewport.setPointerCapture(e.pointerId);
});
viewport.addEventListener('pointermove', (e) => {
  if (!drag) return;
  tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply();
});
viewport.addEventListener('pointerup', () => { drag = null; viewport.classList.remove('dragging'); });

addEventListener('keydown', (e) => {
  const typing = document.activeElement === qEl;
  if (e.key === '/' && !typing) { e.preventDefault(); qEl.focus(); }
  if (e.key === '\\' && !typing) { e.preventDefault(); navBtn.onclick(); }
  if (e.key === 'Enter' && typing) {
    const first = document.querySelector('.nav-item:not(.faded)');
    if (first) { focusScreen(first.dataset.id); qEl.blur(); }
  }
  if (e.key === 'Escape') { qEl.value = ''; applyFilter(); qEl.blur(); }
});

apply();
// A deep link wins over the default fit — you asked for a screen, not the map.
setTimeout(() => { if (!focusFromHash()) fitWidth(); }, 60);
</script>
</body>
</html>
