openapi: 3.1.0
info:
  title: <Module Name> API
  description: |
    Contract fragment for the <module> spec.
    Source: project-spec/specs/<module>.md
    Backend impl-doc: poly-backend/docs/<module>-backend.md
  version: 1.0.0

servers:
  - url: https://api.321fit.example/api/v1.0.0
    description: Production
  - url: http://localhost:8000/api/v1.0.0
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: <module>
    description: <one-line description>

paths:
  /coach/<resource>:
    get:
      tags: [<module>]
      summary: Short summary, sentence case
      description: |
        Longer description. Reference spec section when helpful.
        See project-spec/specs/<module>.md#<section-anchor>
      operationId: get<Module><Resource>
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/<ResponseType>"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "_baseline.openapi.yaml#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "_baseline.openapi.yaml#/components/schemas/Error"

    post:
      tags: [<module>]
      summary: Create something
      operationId: create<Module><Resource>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/<RequestType>"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/<ResponseType>"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "_baseline.openapi.yaml#/components/schemas/ValidationError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    <ResponseType>:
      type: object
      required: [id, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 UTC, e.g. 2026-04-27T10:00:00Z
        # Money example
        amount:
          type: object
          required: [amount, currency]
          properties:
            amount:
              type: integer
              description: Minor units (cents)
              example: 2500
            currency:
              type: string
              description: ISO-4217 code
              example: EUR

    <RequestType>:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
